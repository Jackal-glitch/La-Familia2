<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12203a">
<meta name="robots" content="noindex, nofollow">
<title>La Familia | Gestion des prêts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312203a'/%3E%3Cpath d='M9 8v16h9M22 8v16' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --paper:#f2f4f7; --card:#fff; --ink:#15233b; --ink2:#586579; --rule:#d3d9e2; --rule2:#e7ebf0;
  --rail:#12203a; --rail2:#1d2f52;
  --green:#0e6b57; --green-s:#dcefe8;
  --red:#c2342b; --red-s:#f9e1de;
  --amber:#a3650a; --amber-s:#fbedcf;
  --blue:#2c5c9c; --blue-s:#e0eaf6;
  --slate:#586579; --slate-s:#e6e9ef;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 var(--sans);color:var(--ink);background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:27px;line-height:1.15;font-weight:750;letter-spacing:-.02em}
h2{font-size:16px;font-weight:700;letter-spacing:-.005em}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.86em;color:var(--ink2)}
.hint{color:var(--ink2);font-size:14px}
[hidden]{display:none!important}

/* ---------- Structure ---------- */
.shell{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:#dfe6f2;display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}
.brand b{display:block;font-size:17px;color:#fff;letter-spacing:-.01em;line-height:1.2}
.brand span:not(.mark){display:block;font-size:13px;color:#9fb0cc}
.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:#fff;color:var(--rail);font-weight:800;font-size:15px;letter-spacing:-.03em;flex:none}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav a{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:7px;color:#c9d4e8;text-decoration:none;font-weight:550}
.rail nav a:hover{background:var(--rail2)}
.rail nav a.on{background:#fff;color:var(--rail)}
.rail-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid #2a3c60;display:grid;gap:6px;font-size:13px}
.who{color:#fff;font-weight:600;overflow-wrap:anywhere}
.who span{display:block;font-weight:400;color:#9fb0cc}
.live{display:flex;align-items:center;gap:7px;color:#9fb0cc}
.live i{width:8px;height:8px;border-radius:50%;background:#e0a526;flex:none}
.live.on i{background:#3ecf8e}
.live:not(.on) span::after{content:" (reconnexion…)"}
.linklike{background:none;border:0;padding:0;color:#9fb0cc;text-align:left;cursor:pointer;text-decoration:underline;font-size:13px}
.content{min-width:0}
.topbar{display:none}
.main{padding:30px 34px 60px;max-width:1240px;background:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(21,35,59,.05) 31px 32px);min-height:100vh}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h .sub{color:var(--ink2);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabbar{display:none}

/* ---------- Composants ---------- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:8px;margin-bottom:18px;min-width:0}
.panel>h2,.form>h2{margin:0 0 12px}
.form{padding:20px 22px}
.form>h2:not(:first-child){margin-top:24px;padding-top:18px;border-top:1px solid var(--rule2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border:1px solid var(--rule);border-radius:6px;background:#fff;font-weight:600;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:#aab4c4;background:#f7f9fb}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#0b5947}
.btn.danger{color:var(--red);border-color:#e6b9b4}
.btn.danger:hover{background:var(--red-s)}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn.lg{padding:12px 22px;font-size:16px}
.btn:disabled{opacity:.55;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border:1px solid var(--rule);border-radius:6px;background:#fff;cursor:pointer;font-weight:550;font-size:14px;line-height:1.2}
.chip:hover{border-color:#aab4c4}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips.sm{margin-top:7px}.chips.sm .chip{padding:4px 9px;font-size:13px}
.seg{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.field{display:grid;gap:5px;align-content:start;min-width:0}
.field label{font-size:13.5px;font-weight:600;color:var(--ink2)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #bcc5d2;border-radius:6px;background:#fff;min-width:0}
input[type=date]{min-height:41px}
textarea{resize:vertical}
input:disabled{background:var(--paper);color:var(--ink2)}
.grid-f{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field.wide{grid-column:1/-1}
.form-actions{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px;align-items:start}
.split>.panel{margin-bottom:0}
.badge{display:inline-block;padding:2px 9px;border-radius:5px;font-size:13px;font-weight:600;white-space:nowrap}
.badge.blue{background:var(--blue-s);color:var(--blue)}.badge.red{background:var(--red-s);color:var(--red)}
.badge.green{background:var(--green-s);color:var(--green)}.badge.slate{background:var(--slate-s);color:var(--slate)}
.badge.amber{background:var(--amber-s);color:var(--amber)}
.note{padding:9px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.note.red{background:var(--red-s);color:#8f231b}.note.amber{background:var(--amber-s);color:#7c4b05}.note.green{background:var(--green-s);color:#0a5342}
.err{color:var(--red);min-height:1.4em;font-size:14px}
.searchbox{display:flex;align-items:center;gap:10px;border:1px solid #bcc5d2;border-radius:6px;padding:0 12px;background:#fff;min-width:0}
.searchbox svg{flex:none}
.searchbox input{border:0;padding:12px 0;outline:0;font-size:16px}
.searchbox:focus-within{outline:2px solid var(--green);outline-offset:1px}
.toolbar{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.tb-row{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.inline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.inline select{width:auto;padding:6px 9px}
.daterange{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.daterange label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.daterange input{width:auto}
.toolbar-lite{margin-bottom:16px}

/* ---------- Registre (chiffres) ---------- */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.cell{padding:15px 18px;border-right:1px solid var(--rule2);border-bottom:1px solid var(--rule2);margin:0 -1px -1px 0;min-width:0}
.cell .lbl{display:block;font-size:13.5px;color:var(--ink2)}
.fig{display:block;font-size:24px;line-height:1.2;font-weight:720;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:3px;overflow-wrap:anywhere}
.cell .sub{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.cell.pos .fig{color:var(--green)}.cell.neg .fig{color:var(--red)}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);overflow:hidden}
.hero-main{padding:22px 24px;border-right:1px solid var(--rule)}
.fig.xl{font-size:clamp(34px,5vw,54px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:8px 0 10px}
.fig.xl.neg{color:var(--red)}.fig.xl.pos{color:var(--green)}
.hero-main .sub{color:var(--ink2);font-size:13.5px;max-width:34ch;display:block}
.hero-side{display:grid;grid-template-columns:repeat(3,1fr)}
.hero-side .cell{border-bottom:0;padding:22px 18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px;flex-wrap:wrap}
.sec-h span{color:var(--ink2);font-size:14px}
.rows{display:grid}
.rows>div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--rule2)}
.rows>div:last-child{border-bottom:0}
.rows span{color:var(--ink2)}
.rows b{font-variant-numeric:tabular-nums;text-align:right}
.rows .total b{font-size:20px}
.rows .total span{color:var(--ink);font-weight:600}
#loanSummary{margin-top:20px;padding:6px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
#loanSummary .hint{padding:10px 0}

/* ---------- Graphiques ---------- */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid2>.panel,.grid3>.panel{margin-bottom:0;padding:18px 20px}
.chart{width:100%;min-height:220px;margin-top:8px}
.chart svg{display:block;width:100%;height:auto}
.grid{stroke:var(--rule2);stroke-width:1}.grid.zero{stroke:#8b96a8}
.tick{fill:var(--ink2);font-size:11.5px;font-family:var(--sans)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:8px}
.donut{width:136px;height:136px;flex:none}
.dn{font-size:28px;font-weight:750;fill:var(--ink)}.dl{font-size:11.5px;fill:var(--ink2)}
.dlist{display:grid;gap:7px;flex:1;min-width:150px;font-size:14px}
.dlist div{display:flex;justify-content:space-between;gap:10px}
.dlist i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.list{display:grid;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--rule2);background:none;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover b:first-child{text-decoration:underline}
.row .r{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.row small{display:block;color:var(--ink2);font-size:13px}
.empty{padding:26px 20px;color:var(--ink2);text-align:center}
.empty .btn{margin-top:12px}
.feed{display:grid;margin-top:6px}
.feed div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule2);font-size:14px}
.feed div:last-child{border-bottom:0}
.feed time{color:var(--ink2);font-size:13px}

/* ---------- Tableaux ---------- */
.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:600;font-size:13.5px;color:var(--ink2);padding:11px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;user-select:none}
.tbl th[data-act]{cursor:pointer}.tbl th[data-act]:hover{color:var(--ink)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--rule2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr[data-act]{cursor:pointer}.tbl tbody tr[data-act]:hover{background:#f6f8fb}
.tbl td small{display:block;color:var(--ink2);font-size:12.5px}
.num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:4px;background:var(--rule2);border-radius:2px;margin-top:5px;min-width:70px}
.bar i{display:block;height:100%;background:var(--green);border-radius:2px}
.tbl.mini{font-size:14px}.tbl.mini th{cursor:default}
.sumline{display:flex;flex-wrap:wrap;gap:6px 26px;padding:12px 16px;border-bottom:1px solid var(--rule);font-size:14px;color:var(--ink2)}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}
.sumline-wrap{border-bottom:1px solid var(--rule)}
.statusbar{padding:12px 16px;border-bottom:1px solid var(--rule)}

/* ---------- Fenêtre (fiche prêt / client) ---------- */
.overlay{position:fixed;inset:0;background:rgba(13,22,40,.55);display:flex;justify-content:flex-end;z-index:50}
.sheet{background:var(--card);width:min(640px,100%);height:100%;overflow-y:auto;padding:24px 26px 40px;animation:slide .18s ease-out;outline:0}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:6px}
.sheet-h h2{font-size:22px;letter-spacing:-.02em}
.x{background:none;border:1px solid var(--rule);border-radius:6px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.sheet h3{font-size:15px;margin:26px 0 8px;padding-top:16px;border-top:1px solid var(--rule)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin:14px 0}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule2);font-size:14.5px}
.facts dt{color:var(--ink2)}.facts dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;overflow-wrap:anywhere}
.progress{margin:14px 0 4px}
.progress .bar{height:8px;border-radius:4px}
.progress p{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);margin-top:6px}
.payrow{display:grid;grid-template-columns:110px 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule2);font-size:14.5px}
.payrow small{color:var(--ink2)}
.payform{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding:14px;background:var(--paper);border-radius:8px}
.payform .wide{grid-column:1/-1}
.payform .linklike{color:var(--blue);font-size:13px}
.hist{display:grid;margin-top:6px}
.hist div{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule2);font-size:14px}
.hist time{color:var(--ink2);font-size:13px}
.hist .is-note span{border-left:3px solid var(--amber);padding-left:9px}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.print-head{display:none}
.quick{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:2px}
.sched{max-height:260px;overflow:auto;border:1px solid var(--rule2);border-radius:6px}
.sched table{border-collapse:collapse;width:100%;font-size:13.5px}
.sched th,.sched td{padding:6px 10px;border-bottom:1px solid var(--rule2);text-align:left;white-space:nowrap}
.sched th{position:sticky;top:0;background:var(--paper);color:var(--ink2);font-weight:600}
.sched .num{text-align:right}
.chosen{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--green);background:var(--green-s);border-radius:8px}
.chosen b{margin-right:10px}
.results{display:grid;margin-top:8px;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.results:empty{display:none}
.result{display:flex;align-items:center;gap:10px;width:100%;padding:10px 13px;border:0;border-bottom:1px solid var(--rule2);background:#fff;cursor:pointer;text-align:left}
.result:last-child{border-bottom:0}.result:hover{background:#f4f7fa}
.result .badge{margin-left:auto}
.results .hint{padding:12px 14px}
#clientHistory{padding:20px 22px}
.cp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.contact{color:var(--ink2);font-size:14px;margin:4px 0 6px}
.ledger.sm{grid-template-columns:repeat(2,1fr);margin:12px -1px 12px 0;border-top:1px solid var(--rule2)}
.ledger.sm .fig{font-size:20px}

/* ---------- Connexion, notifications ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--rail)}
.login-card{background:#fff;width:min(420px,100%);padding:30px 28px;border-radius:12px;display:grid;gap:16px}
.login-card .brand{padding:0}.login-card .brand b{color:var(--ink)}.login-card .brand span:not(.mark){color:var(--ink2)}
.login-card .mark{background:var(--rail);color:#fff}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:grid;gap:8px;z-index:80;width:min(440px,calc(100% - 28px))}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:8px;font-weight:550;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}

.urow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--rule2)}
.urow small{display:block;color:var(--ink2);font-size:13.5px}
.urow .acts{display:flex;gap:8px;flex-wrap:wrap}
.hist-m{display:none}
@media (max-width:980px){
  .hist-m:not(:empty){display:block;margin-top:14px;padding:16px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
  .hist-m .list{margin-top:8px}
  #clientHistory{display:none}
}

/* ---------- Import depuis un tableur ---------- */
.sheet.wide{width:min(1000px,100%)}
.imp-sheet{border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin:14px 0}
.imp-head{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap}
.imp-ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.imp-ctl label,.imp-opts>label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);font-weight:600}
.imp-ctl select,.imp-opts select{width:auto;padding:6px 9px}
.imp-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px;margin:14px 0}
.imp-map label{display:grid;gap:4px;font-size:13.5px;color:var(--ink2);font-weight:600}
.imp-map label.req::after{content:"*";color:var(--red);margin-left:4px;font-weight:700}
.imp-map label.req{grid-template-columns:1fr auto;align-items:end}
.imp-map label.req select{grid-column:1/-1;grid-row:2}
.imp-prev{overflow-x:auto;margin-top:8px;border:1px solid var(--rule2);border-radius:6px}
.imp-prev table{border-collapse:collapse;font-size:13px;width:100%}
.imp-prev th,.imp-prev td{padding:5px 10px;border-right:1px solid var(--rule2);border-bottom:1px solid var(--rule2);white-space:nowrap;text-align:left;vertical-align:top}
.imp-prev th{background:var(--paper);font-weight:600;color:var(--ink2)}
.imp-prev th.mapped{background:var(--green-s);color:var(--green)}
.imp-prev th small{display:block;font-weight:500;font-size:11.5px}
.imp-opts{border-top:1px solid var(--rule);margin-top:18px;padding-top:16px;display:grid;gap:12px}
.imp-opts .chk{font-weight:500;color:var(--ink)}
.imp-opts .chk input{width:auto}
.imp-opts .seg .chip{cursor:pointer;margin:0}
.imp-list{border:1px solid var(--rule);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.imp-list summary{cursor:pointer;font-weight:600}
.imp-list div{padding:5px 0;border-top:1px solid var(--rule2);margin-top:5px}
.imp-list.err{border-color:#e6b9b4;background:var(--red-s)}
@media (max-width:860px){.imp-map{grid-template-columns:1fr}}
/* ---------- Mobile ---------- */
@media (max-width:980px){
  .split,.grid2,.grid3,.hero{grid-template-columns:1fr}
  .hero-main{border-right:0;border-bottom:1px solid var(--rule)}
}
@media (max-width:860px){
  .shell{display:block}
  .rail{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--rail);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20}
  .topbar .brand{padding:0}.topbar .mark{width:32px;height:32px;font-size:13px}.topbar .brand span:not(.mark){display:none}
  .topbar .live{font-size:13px}
  .topbar .linklike{color:#c9d4e8}
  .topbar>div:last-child{display:flex;gap:14px;align-items:center}
  .main{padding:18px 14px 96px}
  h1{font-size:23px}

<body>
<div id="app"></div>
<noscript>Cette application nécessite JavaScript.</noscript>
<script src="/lending.js"></script>
<script>
(() => {
'use strict';

/* ============================================================
   Utilitaires
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoD(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const plural = (n, one, many) => n > 1 ? many : one;
const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* stockage indisponible */ } };
const fetchStore = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };

const nf0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const cf = new Intl.NumberFormat('fr-FR', { notation: 'compact', maximumFractionDigits: 1 });
const cur = () => S.data.settings.currency || '';
const money = n => { const v = round2(n || 0); return (Number.isInteger(v) ? nf0.format(v) : nf2.format(v)) + '\u00a0' + esc(cur()); };
const compact = n => cf.format(n);
const fmtDate = s => s ? parseD(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const fmtDT = iso => new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, Math.round(a / b * 100))) : 0;

const ICONS = {
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  wallet: '<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><path d="M16 14.5h.01"/>',
  sliders: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>'
};
const ic = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ============================================================
   État
   ============================================================ */
const S = {
  token: fetchStore('lf_token'), role: fetchStore('lf_role'), user: fetchStore('lf_user'),
  rev: -1, today: isoD(new Date()),
  data: { settings: { company: 'La Familia', currency: '$', defaultRate: 20 }, clients: [], loans: [], expenses: [], log: [] },
  rows: [], rowMap: new Map(), charts: {},
  view: 'dashboard',
  dash: { preset: 'month', from: '', to: '' },
  db: { q: '', preset: 'all', from: '', to: '', by: 'start', status: 'all', sort: 'startDate', dir: 'desc', limit: 200 },
  exp: { preset: 'month', from: '', to: '', type: 'all' },
  expType: 'depense',
  form: { mode: 'existing', clientId: null }, keepForm: false,
  modal: null, live: false, es: null
};

const NAV = [
  { id: 'dashboard', label: 'Tableau de bord', short: 'Tableau', icon: 'chart' },
  { id: 'new', label: 'Nouveau prêt', short: 'Nouveau', icon: 'plus', admin: true },
  { id: 'loans', label: 'Prêts', short: 'Prêts', icon: 'list' },
  { id: 'expenses', label: 'Dépenses et retraits', short: 'Dépenses', icon: 'wallet' },
  { id: 'settings', label: 'Réglages', short: 'Réglages', icon: 'sliders' }
];
const STATUS = { encours: ['En cours', 'blue'], retard: ['En retard', 'red'], rembourse: ['Clôturé', 'green'], perdu: ['Perdu', 'slate'] };
const EXP_TYPES = { depense: ['Dépense', 'red'], retrait: ['Retrait du propriétaire', 'amber'], apport: ['Apport de capital', 'green'] };
const PRESETS = [['all', 'Tout'], ['today', "Aujourd'hui"], ['7', '7 jours'], ['30', '30 jours'], ['90', '90 jours'], ['month', 'Ce mois'], ['lastmonth', 'Mois dernier'], ['year', 'Cette année'], ['custom', 'Dates précises']];
const STATE_OF = { dash: () => S.dash, db: () => S.db, exp: () => S.exp };

const isAdmin = () => S.role === 'admin';
const backupStale = () => { const t = Number(fetchStore('lf_backup_at') || 0); return !t || Date.now() - t > 7 * 864e5; };
const badge = r => { const [l, c] = STATUS[r.status]; return `<span class="badge ${c}">${l}${r.status === 'retard' ? ` de ${r.daysLate} j` : ''}</span>`; };

/* ============================================================
   API et temps réel
   ============================================================ */
const NO_SERVER = location.protocol === 'file:'
  ? "Cette page est ouverte comme un simple fichier. Lancez le serveur (demarrer.command ou demarrer.bat), puis ouvrez http://localhost:3000 dans le navigateur."
  : "Impossible de joindre le serveur. Vérifiez que sa fenêtre est toujours ouverte, puis réessayez.";
async function api(method, url, body) {
  let r;
  try {
    r = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
      body: body !== undefined ? JSON.stringify(body) : undefined
    });
  } catch { throw new Error(NO_SERVER); }
  let j = {};
  try { j = await r.json(); } catch { /* corps vide */ }
  if (r.status === 401 && S.token) { logout(true); throw new Error('Session expirée'); }
  if (!r.ok) throw new Error(j.error || 'Erreur ' + r.status);
  return j;
}

function applyData(r) {
  S.rev = r.rev; S.today = r.today; S.role = r.role;
  if (r.user) { S.user = r.user.username; store('lf_user', S.user); }
  S.data = { settings: r.settings, clients: r.clients, loans: r.loans, expenses: r.expenses, log: r.log || [] };
  recompute();
}

async function refresh(force = false) {
  try {
    const r = await api('GET', '/api/data?rev=' + (force ? -1 : S.rev));
    setLive(true);
    if (r.unchanged) {
      if (r.today !== S.today) { S.today = r.today; recompute(); render(); }
      return;
    }
    applyData(r);
    render(force);
  } catch (e) {
    if (S.token) { setLive(false); if (force) toast(e.message, 'err'); }
  }
}

function setLive(on) { S.live = on; $$('.live').forEach(el => el.classList.toggle('on', on)); }
function connectLive() { /* la synchronisation se fait par interrogation régulière (voir plus bas) */ }
function closeLive() { setLive(false); }

/* ============================================================
   Calculs métier
   ============================================================ */
function recompute() {
  const cmap = new Map(S.data.clients.map(c => [c.id, c]));
  S.rows = S.data.loans.map(l => {
    const c = Lending.compute(l, l.payments, S.today), byId = new Map(l.payments.map(p => [p.id, p]));
    const pays = c.allocations.map(a => ({ ...(byId.get(a.id) || {}), id: a.id, date: a.date, amount: a.amount, interestPart: a.interest, principalPart: a.principal }));
    return {
      ...l, client: cmap.get(l.clientId) || { id: l.clientId, name: '(client supprimé)' }, calc: c, pays,
      status: c.status, paid: c.totalPaid, principalOut: c.principalOut, interestPaid: c.interestPaid, dueNow: c.dueNow, overdue: c.overdue,
      payoff: c.payoff, nextDue: c.nextDue, monthlyInterest: c.monthlyInterest, months: c.months, daysLate: c.daysLate, lost: c.lost,
      closedDate: c.closedDate, lastPay: pays.length ? pays[pays.length - 1].date : null
    };
  });
  S.rowMap = new Map(S.rows.map(r => [r.id, r]));
}

function range(st) {
  const t = S.today, [y, m] = t.split('-').map(Number);
  switch (st.preset) {
    case 'today': return [t, t];
    case '7': return [addDays(t, -6), t];
    case '30': return [addDays(t, -29), t];
    case '90': return [addDays(t, -89), t];
    case 'month': return [`${y}-${pad(m)}-01`, isoD(new Date(y, m, 0))];
    case 'lastmonth': return [isoD(new Date(y, m - 2, 1)), isoD(new Date(y, m - 1, 0))];
    case 'year': return [`${y}-01-01`, `${y}-12-31`];
    case 'custom': return [st.from || null, st.to || null];
    default: return [null, null];
  }
}
const inRange = (d, [a, b]) => (!a || d >= a) && (!b || d <= b);
function periodLabel(st) {
  const [a, b] = range(st);
  if (!a && !b) return 'depuis le début';
  if (a && b) return a === b ? `le ${fmtDate(a)}` : `du ${fmtDate(a)} au ${fmtDate(b)}`;
  return a ? `depuis le ${fmtDate(a)}` : `jusqu'au ${fmtDate(b)}`;
}

function totals() {
  let outstanding = 0, monthlyIncome = 0, dueNow = 0, lateN = 0, lateAmt = 0, openN = 0, cash = 0, hasInjection = false;
  const by = { encours: { n: 0, amt: 0 }, retard: { n: 0, amt: 0 }, rembourse: { n: 0, amt: 0 }, perdu: { n: 0, amt: 0 } };
  for (const r of S.rows) {
    cash += r.paid - r.principal;
    by[r.status].n++; by[r.status].amt += r.principal;
    if (r.status === 'encours' || r.status === 'retard') {
      openN++; outstanding += r.principalOut; monthlyIncome += r.monthlyInterest; dueNow += r.dueNow;
      if (r.status === 'retard') { lateN++; lateAmt += r.overdue; }
    }
  }
  for (const e of S.data.expenses) { if (e.type === 'apport') { cash += e.amount; hasInjection = true; } else cash -= e.amount; }
  return { cash: round2(cash), outstanding: round2(outstanding), monthlyIncome: round2(monthlyIncome), dueNow: round2(dueNow), lateN, lateAmt: round2(lateAmt), openN, by, hasInjection };
}

function periodStats(rg) {
  const o = { lent: 0, lentN: 0, collected: 0, interest: 0, principalBack: 0, exp: 0, wd: 0, inj: 0, loss: 0, dueTotal: 0, dueCollected: 0 };
  for (const r of S.rows) {
    if (inRange(r.startDate, rg)) { o.lent += r.principal; o.lentN++; }
    for (const p of r.pays) if (inRange(p.date, rg)) { o.collected += p.amount; o.interest += p.interestPart; o.principalBack += p.principalPart; }
    if (r.writtenOff && inRange(r.writtenOff.date, rg)) o.loss += r.lost;
    for (const c of r.calc.cycles) if (c.end <= S.today && inRange(c.end, rg)) { o.dueTotal += c.interest; o.dueCollected += c.paid; }
  }
  for (const e of S.data.expenses) {
    if (!inRange(e.date, rg)) continue;
    if (e.type === 'depense') o.exp += e.amount; else if (e.type === 'retrait') o.wd += e.amount; else o.inj += e.amount;
  }
  o.net = o.interest - o.exp - o.loss;
  o.rate = o.dueTotal > 0 ? o.dueCollected / o.dueTotal : null;
  return o;
}

function monthly() {
  const [ty, tm] = S.today.split('-').map(Number);
  let earliest = S.today;
  S.rows.forEach(r => { if (r.startDate < earliest) earliest = r.startDate; });
  S.data.expenses.forEach(e => { if (e.date < earliest) earliest = e.date; });
  const [ey, em] = earliest.split('-').map(Number);
  const span = Math.min(12, Math.max(6, (ty - ey) * 12 + (tm - em) + 1));
  const keys = [], labels = [];
  for (let i = span - 1; i >= 0; i--) {
    const d = new Date(ty, tm - 1 - i, 1);
    keys.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`);
    let l = d.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '');
    if (d.getMonth() === 0 || i === span - 1) l += ' ' + String(d.getFullYear()).slice(2);
    labels.push(l);
  }
  const idx = new Map(keys.map((k, i) => [k, i]));
  const z = () => keys.map(() => 0);
  const lent = z(), coll = z(), net = z();
  for (const r of S.rows) {
    let i = idx.get(r.startDate.slice(0, 7)); if (i !== undefined) lent[i] += r.principal;
    for (const p of r.pays) { i = idx.get(p.date.slice(0, 7)); if (i !== undefined) { coll[i] += p.amount; net[i] += p.interestPart; } }
    if (r.writtenOff) { i = idx.get(r.writtenOff.date.slice(0, 7)); if (i !== undefined) net[i] -= r.lost; }
  }
  for (const e of S.data.expenses) if (e.type === 'depense') { const i = idx.get(e.date.slice(0, 7)); if (i !== undefined) net[i] -= e.amount; }
  return { labels, lent: lent.map(round2), coll: coll.map(round2), net: net.map(round2) };
}

function clientStats(rs) {
  const active = rs.filter(r => r.status === 'encours' || r.status === 'retard');
  const late = rs.filter(r => r.status === 'retard');
  return {
    n: rs.length, borrowed: rs.reduce((s, r) => s + r.principal, 0),
    open: active.length, capital: active.reduce((s, r) => s + r.principalOut, 0),
    late: late.length, lateAmt: late.reduce((s, r) => s + r.overdue, 0),
    lost: rs.filter(r => r.status === 'perdu').length, done: rs.filter(r => r.status === 'rembourse').length
  };
}

/* ============================================================
   Graphiques (SVG, sans bibliothèque)
   ============================================================ */
function niceRange(mn, mx) {
  if (mn === 0 && mx === 0) return { lo: 0, hi: 4, step: 1 };
  const raw = (mx - mn) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return { lo: Math.floor(mn / step) * step, hi: Math.ceil(mx / step) * step, step };
}
function barChart(w, h, spec) {
  const { labels, series } = spec, L = 46, R = 6, T = 8, B = 26, pw = w - L - R, ph = h - T - B;
  let mn = 0, mx = 0;
  series.forEach(s => s.values.forEach(v => { mn = Math.min(mn, v); mx = Math.max(mx, v); }));
  const { lo, hi, step } = niceRange(mn, mx), y = v => T + ph * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (let v = lo; v <= hi + step / 1000; v += step) {
    const yy = y(v).toFixed(1);
    g += `<line x1="${L}" x2="${w - R}" y1="${yy}" y2="${yy}" class="grid${Math.abs(v) < step / 1000 ? ' zero' : ''}"/><text x="${L - 6}" y="${+yy + 4}" text-anchor="end" class="tick">${esc(compact(v))}</text>`;
  }
  const n = labels.length, gw = pw / n, bw = Math.min(30, gw * .74 / series.length), off = (gw - bw * series.length) / 2;
  const skip = w < 430 && n > 8 ? 2 : 1;
  let bars = '', xl = '';
  labels.forEach((lb, i) => {
    const x0 = L + i * gw + off;
    series.forEach((s, j) => {
      const v = s.values[i], top = v >= 0 ? y(v) : y(0), hh = Math.abs(y(v) - y(0));
      bars += `<rect x="${(x0 + j * bw).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${(v ? Math.max(hh, 1.5) : 0).toFixed(1)}" rx="2" style="fill:${v < 0 && s.neg ? s.neg : s.color}"><title>${esc(lb)} : ${esc(s.name)} ${money(v)}</title></rect>`;
    });
    if ((n - 1 - i) % skip === 0) xl += `<text x="${(L + i * gw + gw / 2).toFixed(1)}" y="${h - 7}" text-anchor="middle" class="tick">${esc(lb)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(spec.title)}">${g}${bars}${xl}</svg>`;
}
function donut(items) {
  const total = items.reduce((s, i) => s + i.n, 0), R = 52, C = 2 * Math.PI * R;
  let off = 0;
  const segs = total ? items.filter(i => i.n > 0).map(i => {
    const len = C * i.n / total;
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke-width="20" style="stroke:${i.color}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(i.label)} : ${i.n}</title></circle>`;
    off += len; return s;
  }).join('') : `<circle cx="70" cy="70" r="${R}" fill="none" stroke-width="20" style="stroke:var(--rule2)"/>`;
  return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Répartition des prêts par statut">${segs}<text x="70" y="70" text-anchor="middle" class="dn">${total}</text><text x="70" y="88" text-anchor="middle" class="dl">${plural(total, 'prêt', 'prêts')}</text></svg>`;
}
function drawCharts() {
  $$('.chart[data-chart]').forEach(el => {
    const spec = S.charts[el.dataset.chart]; if (!spec) return;
    el.innerHTML = barChart(Math.max(260, Math.floor(el.clientWidth)), 224, spec);
  });
}

/* ============================================================
   Coque de l'application
   ============================================================ */
const brandHTML = '<div class="brand"><span class="mark">LF</span><div><b>La Familia</b><span>Gestion des prêts</span></div></div>';
async function showLogin(msg = '') {
  closeLive();
  $('#app').innerHTML = `<main class="login"><div class="login-card">${brandHTML}<p class="hint">Chargement…</p></div></main>`;
  let st = { needsSetup: false };
  try { st = await api('GET', '/api/status'); } catch (e) { msg = msg || e.message; }
  let card;
  if (st.needsSetup) {
    card = `<form id="setupForm" class="login-card" novalidate>${brandHTML}<h1>Créer le compte gestionnaire</h1>
      <p class="hint">Première ouverture : choisissez votre nom d'utilisateur et votre mot de passe. Ils sont enregistrés sur le serveur et serviront à chaque connexion.</p>

async function authRequest(url, payload, btn) {
  btn.disabled = true;
  try {
    const r = await api('POST', url, payload);
    S.token = r.token; S.role = r.role; S.user = r.username;
    store('lf_token', r.token); store('lf_role', r.role); store('lf_user', r.username);
    await boot();
  } catch (err) { $('#loginErr').textContent = err.message; btn.disabled = false; }
}
function doLogin() {
  const username = $('#liUser').value.trim(), password = $('#liPass').value;
  if (!username || !password) { $('#loginErr').textContent = "Saisissez votre nom d'utilisateur et votre mot de passe."; return; }
  authRequest('/api/login', { username, password }, $('#loginForm button'));
}
function doSetup() {
  const username = $('#suUser').value.trim(), password = $('#suPass').value;
  if ($('#suPass2').value !== password) { $('#loginErr').textContent = 'Les deux mots de passe ne sont pas identiques.'; return; }
  authRequest('/api/setup', { username, password, setupCode: $('#suCode') ? $('#suCode').value.trim() : '', timezone: Intl.DateTimeFormat().resolvedOptions().timeZone }, $('#setupForm button'));
}
function logout(expired) {
  if (expired && !S.token) return; // plusieurs requêtes ont échoué en même temps : un seul retour à l'écran de connexion
  store('lf_token', null); store('lf_role', null);
  S.token = ''; S.role = ''; S.rev = -1; S.modal = null; document.body.style.overflow = '';
  showLogin(expired ? 'Session expirée. Saisissez de nouveau votre code.' : '');
}

/* ============================================================

   ============================================================ */
const SORTERS = {
  id: r => r.id, client: r => r.client.name, startDate: r => r.startDate, nextDue: r => r.nextDue ? r.nextDue.date : '9999-12-31',
  principal: r => r.principal, principalOut: r => r.principalOut, monthlyInterest: r => r.monthlyInterest, dueNow: r => r.dueNow, paid: r => r.paid,
  status: r => ({ retard: 0, encours: 1, rembourse: 2, perdu: 3 })[r.status]
};
const SORT_OPTIONS = [
  ['startDate:desc', 'Date du prêt, récents d\'abord'], ['startDate:asc', 'Date du prêt, anciens d\'abord'],
  ['nextDue:asc', 'Prochaine échéance'], ['dueNow:desc', 'Intérêts dus, plus élevés'],
  ['principalOut:desc', 'Capital restant, plus élevé'], ['client:asc', 'Client, de A à Z'], ['status:asc', 'Statut']
];

    <label class="searchbox">${ic('search', 18)}<input type="search" id="dbQ" placeholder="ID ou nom du client" data-bind="db.q" value="${esc(S.db.q)}" autocomplete="off" aria-label="Rechercher un client par ID ou par nom"></label>

      <label class="inline">Trier par <select id="dbSort">${SORT_OPTIONS.map(([v, l]) => `<option value="${v}" ${v === S.db.sort + ':' + S.db.dir ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    </div>
    <div id="pb-db"></div>
  </div>
  <div class="panel" id="dbBody"></div>`;

function baseLoans() {
  const tokens = norm(S.db.q).trim().split(/\s+/).filter(Boolean), rg = range(S.db);
  return S.rows.filter(r => {
    if (S.db.by === 'due') { if (r.nextDue ? !inRange(r.nextDue.date, rg) : (rg[0] || rg[1])) return false; }
    else if (!inRange(r.startDate, rg)) return false;
    if (tokens.length) { const hay = norm(`${r.client.id} ${r.client.name} ${r.client.phone || ''} ${r.id}`); if (!tokens.every(t => hay.includes(t))) return false; }
    return true;
  });
}
function filteredLoans() {
  const rows = baseLoans().filter(r => S.db.status === 'all' || r.status === S.db.status);
  const f = SORTERS[S.db.sort] || SORTERS.startDate, dir = S.db.dir === 'asc' ? 1 : -1;
  return rows.sort((a, b) => {
    const x = f(a), y = f(b);
    const c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'fr', { numeric: true });
    return c ? c * dir : b.id.localeCompare(a.id, 'fr', { numeric: true });
  });
}
function updateDB() {
  const body = $('#dbBody'); if (!body) return;
  const base = baseLoans(), rows = filteredLoans();
  const counts = { all: base.length, encours: 0, retard: 0, rembourse: 0, perdu: 0 };
  base.forEach(r => counts[r.status]++);
  const sum = k => rows.reduce((s, r) => s + r[k], 0);
  $('#dbSub').textContent = `${S.rows.length} ${plural(S.rows.length, 'prêt enregistré', 'prêts enregistrés')}`;
  const chips = [['all', 'Tous'], ['encours', 'En cours'], ['retard', 'En retard'], ['rembourse', 'Clôturés'], ['perdu', 'Perdus']];
  const th = (k, l, cls = '') => `<th class="${cls}" data-act="sort" data-k="${k}" aria-sort="${S.db.sort === k ? (S.db.dir === 'asc' ? 'ascending' : 'descending') : 'none'}">${l}${S.db.sort === k ? (S.db.dir === 'asc' ? ' ▲' : ' ▼') : ''}</th>`;
  const shown = rows.slice(0, S.db.limit);
  body.innerHTML = `
  <div class="statusbar"><div class="chips">${chips.map(([v, l]) => `<button type="button" class="chip ${S.db.status === v ? 'on' : ''}" data-act="status" data-v="${v}">${l} (${counts[v]})</button>`).join('')}</div></div>
  <div class="sumline"><span><b>${rows.length}</b> ${plural(rows.length, 'prêt', 'prêts')}</span><span>Prêté <b>${money(sum('principal'))}</b></span><span>Capital restant <b>${money(rows.filter(r => r.status === 'encours' || r.status === 'retard').reduce((s, r) => s + r.principalOut, 0))}</b></span><span>Intérêts encaissés <b>${money(sum('interestPaid'))}</b></span><span>Intérêts dus <b>${money(rows.filter(r => r.status === 'encours' || r.status === 'retard').reduce((s, r) => s + r.dueNow, 0))}</b></span></div>
  ${rows.length ? `<div class="tablewrap"><table class="tbl loans"><thead><tr>${th('id', 'Prêt')}${th('client', 'Client')}${th('startDate', 'Date')}${th('principal', 'Capital', 'num')}${th('principalOut', 'Restant', 'num')}${th('monthlyInterest', 'Par mois', 'num')}${th('nextDue', 'Échéance')}${th('dueNow', 'Dû', 'num')}${th('paid', 'Payé', 'num')}${th('status', 'Statut')}</tr></thead><tbody>
  ${shown.map(r => `<tr data-act="openLoan" data-id="${r.id}">
    <td class="first" data-label="Prêt"><span class="mono">${r.id}</span></td>
    <td class="first" data-label="Client"><b>${esc(r.client.name)}</b><small class="mono">${esc(r.client.id)}</small></td>
    <td class="hm" data-label="Date">${fmtDate(r.startDate)}</td>
    <td class="num" data-label="Capital">${money(r.principal)}</td>
    <td class="num hm" data-label="Restant">${r.status === 'rembourse' ? '—' : money(r.principalOut)}</td>
    <td class="num hm" data-label="Par mois">${r.status === 'encours' || r.status === 'retard' ? money(r.monthlyInterest) : '—'}</td>
    <td data-label="Échéance">${r.nextDue ? fmtDate(r.nextDue.date) : '—'}</td>
    <td class="num" data-label="Dû">${r.status === 'encours' || r.status === 'retard' ? money(r.dueNow) : '—'}</td>
    <td class="num hm" data-label="Payé">${money(r.paid)}</td>
    <td data-label="Statut">${badge(r)}</td></tr>`).join('')}</tbody></table></div>
  ${rows.length > shown.length ? `<div style="padding:14px;text-align:center"><button class="btn" data-act="more">Afficher plus (${rows.length - shown.length} restants)</button></div>` : ''}`
  : `<div class="empty"><p>${S.rows.length ? 'Aucun prêt ne correspond à cette recherche.' : 'Aucun prêt enregistré.'}</p>${S.rows.length ? '<button class="btn" data-act="resetFilters">Effacer les filtres</button>' : (isAdmin() ? '<button class="btn primary" data-act="nav" data-v="new">Enregistrer un prêt</button>' : '')}</div>`}`;
}
function exportCsv() {
  const n = v => String(v).replace('.', ',');
  const head = ['ID prêt', 'ID client', 'Client', 'Téléphone', 'Date du prêt', 'Capital', 'Taux mensuel (%)', 'Capital restant', 'Intérêts par mois', 'Payé (total)', 'Intérêts encaissés', 'Intérêts dus', 'Pour tout solder', 'Prochaine échéance', 'Statut', 'Garantie'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = filteredLoans().map(r => [r.id, r.client.id, r.client.name, r.client.phone || '', r.startDate, n(r.principal), n(r.rate), n(r.principalOut), n(r.monthlyInterest), n(r.paid), n(r.interestPaid), n(r.dueNow), n(r.payoff), r.nextDue ? r.nextDue.date : '', STATUS[r.status][0], r.guarantee || ''].map(q).join(';'));
  download(`prets-${S.today}.csv`, '\ufeff' + [head.map(q).join(';'), ...lines].join('\r\n'), 'text/csv;charset=utf-8');
}
function download(name, content, type) {
  const url = URL.createObjectURL(content instanceof Blob ? content : new Blob([content], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ============================================================
   Historique d'un client (formulaire et fiche)
   ============================================================ */
function clientPanel(id, withOpen = true) {
  const c = S.data.clients.find(x => x.id === id); if (!c) return '';
  const rs = S.rows.filter(r => r.clientId === id).sort((a, b) => a.startDate < b.startDate ? 1 : -1), st = clientStats(rs);
  const warns = [];
  if (st.late) warns.push(['red', `${st.late} ${plural(st.late, 'prêt en retard', 'prêts en retard')}, ${money(st.lateAmt)} d'intérêts impayés.`]);
  else if (st.open) warns.push(['amber', `Ce client a déjà ${st.open} ${plural(st.open, 'prêt en cours', 'prêts en cours')}, capital restant ${money(st.capital)}.`]);
  if (st.lost) warns.push(['red', `${st.lost} ${plural(st.lost, 'prêt classé', 'prêts classés')} en perte.`]);
  return `<div class="cp-head"><div><h2>${esc(c.name)}</h2><span class="mono">${esc(c.id)}</span></div>${withOpen ? `<button type="button" class="btn sm" data-act="openClient" data-id="${esc(c.id)}">Fiche client</button>` : ''}</div>
  <p class="contact">${[c.phone, c.address, c.idNumber ? 'Pièce ' + c.idNumber : ''].filter(Boolean).map(esc).join(', ') || 'Aucune coordonnée enregistrée'}</p>
  ${warns.map(w => `<div class="note ${w[0]}">${w[1]}</div>`).join('')}
  ${rs.length ? `<div class="ledger sm">${cell('Prêts', String(st.n), `${money(st.borrowed)} empruntés`)}${cell('Prêts clôturés', `${st.done} sur ${st.n}`, st.open ? `${st.open} en cours` : 'Aucun prêt en cours')}</div>
  <div class="list">${rs.map(r => `<button type="button" class="row" data-act="openLoan" data-id="${r.id}"><span><b>${money(r.principal)}</b><small>${r.id}, ${fmtDate(r.startDate)}</small></span><span class="r">${badge(r)}<small>${r.status === 'perdu' ? 'Capital perdu ' + money(r.lost) : r.status === 'rembourse' ? 'Clôturé le ' + fmtDate(r.closedDate) : 'Capital restant ' + money(r.principalOut)}</small></span></button>`).join('')}</div>`
  : '<p class="hint" style="margin-top:10px">Aucun prêt pour ce client : ce sera son premier.</p>'}`;
}
function clientTag(id) {
  const st = clientStats(S.rows.filter(r => r.clientId === id));

async function submitLoan() {
  const btn = $('#loanSubmit');
  const d = { principal: $('#fPrincipal').value, startDate: $('#fStart').value, rate: $('#fRate').value, guarantee: $('#fGuar').value, notes: $('#fNotes').value };
  if (S.form.mode === 'existing') {
    if (!S.form.clientId) return toast('Choisissez un client, ou passez à « Nouveau client ».', 'err');
    d.clientId = S.form.clientId;
    const st = clientStats(S.rows.filter(r => r.clientId === d.clientId));
    if (st.late && !confirm(`Ce client a ${st.late} ${plural(st.late, 'prêt', 'prêts')} en retard (${nf0.format(st.lateAmt)} ${cur()}). Enregistrer un nouveau prêt quand même ?`)) return;
  } else {
    d.newClient = { name: $('#nName').value, phone: $('#nPhone').value, idNumber: $('#nIdn').value, address: $('#nAddr').value };
    if (!d.newClient.name.trim()) return toast('Saisissez le nom du client.', 'err');
  }
  if (!(Number(d.principal) > 0)) return toast('Saisissez le montant du prêt.', 'err');
  btn.disabled = true;
  try {
    const r = await api('POST', '/api/loans', d);
    toast(`Prêt ${r.loanId} enregistré`);
    await refresh(true);
    S.db.q = ''; S.db.preset = 'all'; S.db.status = 'all'; S.db.sort = 'startDate'; S.db.dir = 'desc';
    go('loans'); openLoan(r.loanId);
  } catch (e) { toast(e.message, 'err'); btn.disabled = false; }
}

  const hdrs = (sh.rows[sh.hr] || []).map(hnorm), used = new Set(), map = {};

  if (/depense|retrait|sortie|charge|expense|caisse/.test(n)) return 'expenses';

function buildImportPayload() {

  for (const sh of I.sheets) {

    const m = sh.map;
    sh.rows.slice(sh.hr + 1).forEach((r, k) => {
      if (rowBlank(r)) return;
      const row = sh.hr + k + 2, g = f => (m[f] == null ? '' : (r[m[f]] ?? ''));
      const bad = {}, num = f => { const raw = g(f), v = toNumber(raw); if (v == null && String(raw).trim() !== '') bad[f] = cleanText(raw, 30); return v; };
      const dat = f => { const raw = g(f), v = toDate(raw, order); if (v == null && String(raw).trim() !== '') bad[f] = cleanText(raw, 30); return v; };
      if (sh.role === 'loans') {

          principal: principal == null ? null : Math.abs(principal), startDate: dat('startDate'), rate: num('rate'),

          guarantee: cleanText(g('guarantee'), 200), notes: cleanText(g('notes'), 1000), status: cleanText(g('status'), 40), bad

        if (amount == null && !name && !ref) return;
        if (/^total/.test(hnorm(name))) return;

      } else {

        const t = hnorm(g('type')); let type = sh.defType;

  unwriteoff: t => act(() => api('POST', `/api/loans/${encodeURIComponent(t.dataset.id)}/unwriteoff`), 'Perte annulée'),
  delLoan: t => confirm('Supprimer définitivement ce prêt et ses paiements ?') && act(async () => { await api('DELETE', '/api/loans/' + encodeURIComponent(t.dataset.id)); closeModal(); }, 'Prêt supprimé'),

  expType: t => { S.expType = t.dataset.v; $$('[data-act=expType]').forEach(b => b.classList.toggle('on', b === t)); const c = $('#eCat'); if (c) c.placeholder = { depense: 'Ex. Loyer', retrait: 'Ex. Retrait personnel', apport: 'Ex. Capital de départ' }[S.expType]; },
  expFilter: t => { S.exp.type = t.dataset.v; updateExp(); },
  delExp: t => confirm('Supprimer cette ligne ?') && act(() => api('DELETE', '/api/expenses/' + encodeURIComponent(t.dataset.id)), 'Ligne supprimée'),
  delUser: t => confirm(`Supprimer le compte « ${t.dataset.name} » ? Cette personne ne pourra plus se connecter.`) && api('DELETE', '/api/users/' + encodeURIComponent(t.dataset.name)).then(() => { toast('Compte supprimé'); loadUsers(); refresh(true); }).catch(e => toast(e.message, 'err')),
  resetUser: t => { const pw = prompt(`Nouveau mot de passe pour « ${t.dataset.name} » (8 caractères minimum) :`); if (pw) api('PUT', `/api/users/${encodeURIComponent(t.dataset.name)}/password`, { password: pw }).then(() => { toast('Mot de passe réinitialisé'); refresh(true); }).catch(e => toast(e.message, 'err')); },
  openImport, impAnalyze, impRun,
  backup: downloadBackup
};

document.addEventListener('click', e => {
  const ov = e.target.closest('[data-overlay]');
  if (ov && e.target === ov) return closeModal();
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = A[t.dataset.act];
  if (fn) fn(t, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.bind) {
    const [k, f] = el.dataset.bind.split('.'); S[k][f] = el.value;
    if (k === 'db') { S.db.limit = 200; f === 'q' ? dbSearch() : updateDB(); }
    else if (k === 'exp') updateExp(); else if (k === 'dash') updateDashboard();
    return;
  }
  if (el.id === 'dbSort') { const [k, d] = el.value.split(':'); S.db.sort = k; S.db.dir = d; updateDB(); return; }
  if (el.closest && el.closest('#loanForm')) {
    if (el.id === 'clientSearch') updateResults();
    else if (el.id === 'nName') updateHistoryPanel();
    updateSummary();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'restoreFile' && t.files[0]) { restoreBackup(t.files[0]); t.value = ''; }
  else if (t.id === 'impFile' && t.files[0]) { loadImportFile(t.files[0]); t.value = ''; }
  else if (t.dataset && t.dataset.imp && S.imp) impChange(t);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  ({ loginForm: doLogin, setupForm: doSetup, loanForm: submitLoan, expForm: submitExp, settingsForm: submitSettings, userForm: submitUser, pwForm: submitPassword })[e.target.id]?.();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) closeModal(); });
window.addEventListener('hashchange', () => { if (!S.token) return; const id = routeFromHash(); if (id !== S.view) go(id); });
window.addEventListener('resize', debounce(drawCharts, 150));
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token) refresh(); });
setInterval(() => { if (S.token && !document.hidden) refresh(); }, 10000);

/* ============================================================
   Démarrage
   ============================================================ */
async function boot() {
  renderShell();
  await refresh(true);
  if (!S.token) return;
  connectLive();
  S.view = routeFromHash();
  if (S.view === 'new' && !isAdmin()) S.view = 'dashboard';
  mountView();
}
if (S.token) boot(); else showLogin();
})();
</script>
</body>
</html>
